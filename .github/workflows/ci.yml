name: CI

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

env:
  ZIG_VERSION: "0.13.0"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install GTK3 with proper caching
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install GTK3 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev pkg-config

      # Install Zig manually via curl (no hostedtoolcache)
      - name: Install Zig
        run: |
          curl -L https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          sudo mv zig-linux-x86_64-${ZIG_VERSION} /usr/local/zig
          sudo ln -sf /usr/local/zig/zig /usr/local/bin/zig
          zig version

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig') }}-${{ hashFiles('src/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ hashFiles('build.zig') }}-
            ${{ runner.os }}-zig-

      - name: Check formatting
        run: zig fmt --check .

      - name: Build and test
        run: |
          zig build
          zig build test

      - name: Build release
        run: zig build -Doptimize=ReleaseFast

  # Parallel job for faster validation
  validate:
    name: Validate Configs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflows
        run: |
          chmod +x tools/validate_workflows.sh
          ./tools/validate_workflows.sh

      - name: Validate build config
        run: |
          chmod +x tools/validate_build.sh
          ./tools/validate_build.sh
