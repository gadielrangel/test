name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop, feature/*]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel in-progress runs when a new one starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.13.0"
  CACHE_VERSION: v1

jobs:
  # Job 1: Code Quality Checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: ${{ runner.os }}-zig-${{ env.CACHE_VERSION }}-${{ hashFiles('build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ env.CACHE_VERSION }}-

      - name: Format check
        run: zig fmt --check .

      - name: Security audit
        run: |
          echo "Checking for security patterns..."
          ! grep -r "@intCast" src/ || (echo "Warning: Found @intCast usage" && exit 0)
          ! grep -r "@ptrCast" src/ || (echo "Warning: Found @ptrCast usage" && exit 0)

  # Job 2: Build and Test (Linux)
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        optimize: [Debug, ReleaseFast, ReleaseSmall]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GTK3
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: ${{ runner.os }}-zig-${{ matrix.optimize }}-${{ env.CACHE_VERSION }}-${{ hashFiles('build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ matrix.optimize }}-${{ env.CACHE_VERSION }}-

      - name: Run tests
        run: zig build test

      - name: Build (${{ matrix.optimize }})
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Upload artifacts
        if: matrix.optimize == 'ReleaseFast'
        uses: actions/upload-artifact@v4
        with:
          name: menubar-linux-${{ matrix.optimize }}
          path: zig-out/bin/menubar-example
          retention-days: 7

  # Job 3: Build macOS (if supported)
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/zig
            zig-cache
          key: ${{ runner.os }}-zig-${{ env.CACHE_VERSION }}-${{ hashFiles('build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ env.CACHE_VERSION }}-

      - name: Run tests
        run: zig build test

      - name: Build
        run: zig build -Doptimize=ReleaseFast

  # Job 4: Cross-compilation
  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cross-compile for ${{ matrix.target }}
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast || echo "Cross-compilation may fail for GUI apps"

  # Job 5: Dependency Review (on PRs)
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  # Job 6: Performance Benchmarks
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build-linux
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GTK3
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build optimized
        run: zig build -Doptimize=ReleaseFast

      - name: Run benchmarks
        run: |
          echo "Build size benchmarks:"
          ls -lh zig-out/bin/menubar-example
          size zig-out/bin/menubar-example || true

  # Job 7: Code Coverage (optional)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GTK3
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run tests with coverage
        run: zig build test

      - name: Upload to Codecov (optional)
        if: false  # Enable when codecov is configured
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
